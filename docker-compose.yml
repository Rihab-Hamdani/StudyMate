services:

  postgres:
    image: postgres:17
    container_name: studymate-postgres
    restart: always
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate123
      POSTGRES_DB: studymate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  qdrant:
    image: qdrant/qdrant
    container_name: studymate-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage


volumes:

  postgres_data:

  qdrant_data: